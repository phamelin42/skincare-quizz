<a class="app-skip" href="#contenu">Aller au contenu</a>
<header class="app-header">
  <span class="app-brand"><fd-emblem name="sakura" [size]="32" />Skincare Quizz</span>
  <fd-switch [checked]="isDark()" (checkedChange)="setDark($event)">Thème nuit</fd-switch>
</header>

<main id="contenu" class="app-main" tabindex="-1">
  @switch (quiz.screen()) {
    @case ('home') {
      <app-home />
    }
    @case ('quiz') {
      <app-question />
    }
    @case ('analysis') {
      <app-analysis />
    }
    @case ('result') {
      <app-result />
    }
  }
</main>

<footer class="app-footer">
  Les conseils sont généraux et ne remplacent pas l’avis d’un médecin ou d’un dermatologue. Aucune
  marque n’est recommandée.
</footer>
